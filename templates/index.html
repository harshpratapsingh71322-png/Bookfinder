<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFinder Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #202124; color: #e8eaed; font-family: Arial, sans-serif; }
        .search-bar { border-radius: 24px; background: #303134; border: 1px solid #5f6368; color: white; padding: 12px 20px; }
        .product-card { background: #303134; border-radius: 12px; border: 1px solid #3c4043; height: 100%; overflow: hidden; }
        .product-img { height: 200px; object-fit: contain; background: white; padding: 10px; }
        .price { font-size: 1.25rem; font-weight: bold; margin: 8px 0; }
        .store-info { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #bdc1c6; }
        .special-offer { color: #8ab4f8; font-size: 0.85rem; margin-top: 4px; }
        .shop-now { border-top: 1px solid #3c4043; padding: 12px; text-align: left; color: #8ab4f8; text-decoration: none; display: block; }
        .shop-now:hover { background: #3c4043; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-5">
            <h2 class="mb-4">Google Style Book Search</h2>
            <form method="POST" class="col-md-6 mx-auto">
                <input type="text" name="book_name" class="form-control search-bar" placeholder="class 9 Exploration buy" value="{{ book_name }}">
            </form>
        </div>

        {% if results %}
        <h5 class="mb-3">Sponsored products</h5>
        <div class="row row-cols-2 row-cols-md-3 g-3">
            {% for item in results %}
            <div class="col">
                <div class="product-card">
                    <img src="{{ item.img }}" class="product-img w-100" alt="book">
                    <div class="p-3">
                        <div class="text-truncate" style="color: #8ab4f8;">{{ item.title }}</div>
                        <div class="price">{{ item.price }}</div>
                        <div class="store-info">
                            <span style="background: #eee; color:#333; border-radius:50%; width:18px; height:18px; text-align:center; font-size:10px; line-height:18px;">G</span>
                            {{ item.store }}
                        </div>
                        <div class="special-offer">{{ item.special }}</div>
                    </div>
                    <a href="{{ item.link }}" target="_blank" class="shop-now">Shop now</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
