<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFinder | Compare Prices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdfdfd; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 80px 0; border-radius: 0 0 50px 50px; }
        .search-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: -50px; }
        .price-card { border: none; border-radius: 15px; transition: 0.3s; background: #fff; border-left: 5px solid #2a5298; }
        .price-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-buy { border-radius: 50px; padding: 8px 25px; font-weight: 600; }
    </style>
</head>
<body>

<div class="hero-section text-center">
    <div class="container">
        <h1 class="display-4 fw-bold">BookFinder</h1>
        <p class="lead">Class 9 se lekar Competition tak, sabse sasti books yahan milegi.</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 search-card">
            <form method="POST" class="d-flex gap-2">
                <input type="text" name="book_name" class="form-control form-control-lg border-0 bg-light" placeholder="Search your book (e.g. RD Sharma)..." required>
                <button type="submit" class="btn btn-primary btn-lg px-5" style="border-radius: 15px;">Search</button>
            </form>
        </div>
    </div>

    {% if results %}
    <div class="mt-5 mb-5">
        <h3 class="text-center mb-4">Best Prices for <span class="text-primary">"{{ book_name }}"</span></h3>
        <div class="row g-4">
            {% for item in results %}
            <div class="col-md-4">
                <div class="card price-card p-4 shadow-sm">
                    <h5 class="text-muted">{{ item.store }}</h5>
                    <h2 class="fw-bold">₹{{ item.price }}</h2>
                    <a href="{{ item.link }}" class="btn text-white mt-3 btn-buy" style="background-color: {{ item.color }};">View on Store</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>

<footer class="text-center mt-5 p-4 text-muted">
    <p>&copy; 2026 BookFinder India | Built by an Aspirant</p>
</footer>

</body>
</html>
