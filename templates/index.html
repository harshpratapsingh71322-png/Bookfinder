<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFinder Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #202124; color: white; padding-top: 20px; }
        .product-card { background: #303134; border-radius: 12px; border: 1px solid #3c4043; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .img-container { background: white; padding: 15px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .store-logo { max-height: 80px; max-width: 100%; object-fit: contain; }
        .card-body { padding: 12px; flex-grow: 1; }
        .price { color: #8ab4f8; font-size: 1.1rem; font-weight: bold; }
        .shop-btn { background: #3c4043; color: #8ab4f8; text-decoration: none; padding: 10px; text-align: center; border-top: 1px solid #5f6368; font-weight: bold; }
        .shop-btn:hover { background: #4c4e52; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Book Price Comparison</h2>
        <form method="POST" class="mb-5">
            <input type="text" name="book_name" class="form-control" style="border-radius: 25px; padding: 12px;" placeholder="Search for any book (e.g. RD Sharma Class 11)" value="{{ book_name }}">
        </form>

        {% if results %}
        <div class="row row-cols-2 row-cols-md-3 g-3">
            {% for item in results %}
            <div class="col">
                <div class="product-card">
                    <div class="img-container">
                        <img src="{{ item.img }}" class="store-logo" alt="logo">
                    </div>
                    <div class="card-body text-center">
                        <h6 class="text-white">{{ item.store }}</h6>
                        <div class="price">{{ item.price }}</div>
                        <small class="text-secondary">{{ item.offer }}</small>
                    </div>
                    <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer" class="shop-btn">Shop now</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
    </html>
